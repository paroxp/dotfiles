# tmux-256color supports italics and true colour; macOS' system ncurses lacks
# it, so fall back to screen-256color there.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# Pass true colour through (nvim sets termguicolors)
set -as terminal-features ",xterm*:RGB"

set  -g base-index       1
setw -g pane-base-index  1
set  -g renumber-windows on

bind -N "Split the pane into two, left and right" v split-window -h -c "#{pane_current_path}"
bind -N "Split the pane into two, top and bottom" s split-window -v -c "#{pane_current_path}"

set -g status-keys vi
set -g mode-keys   vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -N "Select pane to the left of the active pane" h select-pane -L
bind -N "Select pane below the active pane" j select-pane -D
bind -N "Select pane above the active pane" k select-pane -U
bind -N "Select pane to the right of the active pane" l select-pane -R

bind -r -N "Resize the pane left by 5" \
  H resize-pane -L 5
bind -r -N "Resize the pane down by 5" \
  J resize-pane -D 5
bind -r -N "Resize the pane up by 5" \
  K resize-pane -U 5
bind -r -N "Resize the pane right by 5" \
  L resize-pane -R 5

bind -N "Reload the tmux configuration" \
  r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# rebind main key: C-a (press it twice to send C-a to the application)
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       10
set  -g history-limit     50000

# C-h, C-k and C-l go to nvim when it runs in the pane (it moves between
# splits with them); elsewhere tmux uses them as below.
is_nvim='#{m/ri:^n?vim$,#{pane_current_command}}'

# Clear screen and buffer scroll
bind -n C-k if -F "$is_nvim" { send-keys C-k } {
  send-keys C-l
  run-shell "sleep .3s"
  clear-history
}

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Highlight windows with activity in the status bar, without a message
setw -g monitor-activity on
set  -g visual-activity  off

# Ctrl - t or t new window
unbind C-t
bind-key C-t new-window

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Ctrl-h / Ctrl-l to switch windows
bind -n C-h if -F "$is_nvim" { send-keys C-h } { previous-window }
bind -n C-l if -F "$is_nvim" { send-keys C-l } { next-window }

# Theme: ANSI colours, so tmux follows the terminal palette (omorfos Prism in
# Ghostty) and matches the starship prompt: yellow paths, green host,
# blue git, red for attention, cyan for the active pane as the brand's focus
# colour. Copy mode's selection is the brand's navy-3, as bright black is the
# comment colour and too light to put text on.

#  modes
set -g clock-mode-colour blue
set -g mode-style 'fg=brightwhite bg=#243364 bold'

# panes
set -g pane-border-style        'fg=brightblack'
set -g pane-active-border-style 'fg=cyan'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default fg=white'
set -g status-left '#[fg=blue bold]#S #[default]'
set -g status-right '#{?client_prefix,#[fg=yellow bold]PREFIX ,}#[fg=green]#h #[fg=brightblack]%d/%m #[fg=blue bold]%H:%M'
set -g status-right-length 50
set -g status-left-length 20

set -g window-status-current-style 'fg=yellow bold'
set -g window-status-current-format ' #[fg=blue]#I #[fg=yellow]#W#F '

set -g window-status-style 'fg=white'
set -g window-status-format ' #[fg=brightblack]#I #[default]#W#F '

set -g window-status-activity-style 'fg=red'
set -g window-status-bell-style     'fg=brightred bold'

# messages
set -g message-style         'bg=default fg=yellow bold'
set -g message-command-style 'bg=default fg=yellow'

# Per-machine settings, not tracked
source-file -q ~/.config/tmux/local.conf
