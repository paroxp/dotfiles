# omorfos Prism, the brand's terminal palette; the same colours as the
# Konsole scheme in ~/.local/share/konsole/ and nvim's omorfos scheme.

[main]
# The brand's monospace face, at the size used in Konsole
font=JetBrains Mono:size=12

[cursor]
# Orange, the one brand colour no ANSI slot uses, so it is always findable
color=0C1226 FB923C

[colors]
background=0C1226
foreground=E6EAF5
selection-background=243364
selection-foreground=E6EAF5

regular0=141C38
regular1=F8616D
regular2=84CC16
regular3=FACC15
regular4=60A5FA
regular5=F472B6
regular6=22D3EE
regular7=B8C0DE
